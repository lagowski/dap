# Dependabot configuration — weekly bumps to develop.
# Reference: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/configuration-options-for-dependabot

version: 2
updates:
  # Python dependencies (root workspace + all members) via uv lockfile.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    target-branch: "develop"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      # `include: "scope"` appends the package name after the prefix →
      # `chore(deps): bump foo`. Don't repeat "deps" in the prefix.
      prefix: "chore"
      include: "scope"

  # Dashboard (Next.js) npm/pnpm dependencies. Major updates remain
  # separate by omission from the group update-types.
  - package-ecosystem: "npm"
    directory: "/apps/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    target-branch: "develop"
    groups:
      dashboard-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      # No `include: "scope"` here — the prefix already carries
      # "(dashboard)". Combining a parenthesised prefix with
      # `include: "scope"` would produce double scopes like
      # `chore(dashboard)(typescript): bump foo`.
      prefix: "chore(dashboard)"

  # Playwright E2E dependencies. Kept separate from the dashboard group
  # because these updates exercise different CI jobs and lockfiles.
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 1
    target-branch: "develop"
    groups:
      e2e-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(e2e)"

  # GitHub Actions (workflow `uses:` references). Major action updates
  # remain separate by omission from the group update-types.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "develop"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(ci)"
