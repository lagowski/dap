# Dependabot configuration — weekly bumps to develop.
# Reference: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/configuration-options-for-dependabot

version: 2
updates:
  # Python dependencies (root workspace + all members) via uv lockfile.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Dashboard (Next.js) npm/pnpm dependencies.
  - package-ecosystem: "npm"
    directory: "/apps/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 3
    target-branch: "develop"
    commit-message:
      prefix: "chore(deps,dashboard)"

  # GitHub Actions (workflow `uses:` references).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "develop"
    commit-message:
      prefix: "chore(ci)"
