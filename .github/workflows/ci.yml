name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancel in-progress runs for the same PR/branch when new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    # NOTE: name kept stable — GitHub branch protection references it.
    # Steps below cover ruff, mypy and pytest.
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        run: uv python install

      - name: Install workspace (frozen)
        run: uv sync --all-packages --frozen

      - name: Ruff lint
        run: uv run ruff check apps packages tests

      - name: Ruff format check
        run: uv run ruff format --check apps packages tests

      - name: Mypy
        run: uv run mypy apps packages tests

      - name: Pytest
        run: uv run pytest -q

  pip-audit:
    name: Python deps CVE scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.15"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        run: uv python install

      - name: Install workspace (frozen)
        run: uv sync --all-packages --frozen

      - name: pip-audit
        # Audits the synced venv (uv.lock-frozen). Workspace packages
        # (dap-*, cortex) are skipped as expected — they are local, not
        # on PyPI. CVE detection covers all transitive dependencies.
        run: uv run pip-audit

  dashboard:
    name: Dashboard (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
