name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancel in-progress runs for the same PR/branch when new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.8.15"
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  python:
    # NOTE: name kept stable — GitHub branch protection references it.
    # Steps below cover ruff, mypy and the fast pytest gate.
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        run: uv python install

      - name: Install workspace (frozen)
        run: uv sync --all-packages --frozen

      - name: Ruff lint
        run: uv run ruff check apps packages tests

      - name: Ruff format check
        run: uv run ruff format --check apps packages tests

      - name: Mypy
        run: uv run mypy apps packages tests

      - name: Pytest
        # Fast required gate: all non-integration Python tests plus
        # smoke files tagged ``unit`` by ``tests/smoke/conftest.py``.
        # Heavier smoke tests run in the sharded job below.
        run: uv run pytest -q -m "not integration" --ignore=tests/standalone

  python-smoke:
    name: Python smoke integration (${{ matrix.shard_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_name: "1/3"
          - shard_index: 1
            shard_name: "2/3"
          - shard_index: 2
            shard_name: "3/3"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        run: uv python install

      - name: Install workspace (frozen)
        run: uv sync --all-packages --frozen

      - name: Pytest smoke integration shard
        run: |
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(uv run python .github/scripts/select_pytest_files.py tests/smoke --total 3 --index ${{ matrix.shard_index }})
          uv run pytest -q -m integration "${files[@]}"

  pip-audit:
    name: Python deps CVE scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        run: uv python install

      - name: Install workspace (frozen)
        run: uv sync --all-packages --frozen

      - name: pip-audit
        # Audits the synced venv (uv.lock-frozen). Workspace packages
        # (dap-*) are skipped as expected — they are local, not
        # on PyPI. CVE detection covers all transitive dependencies.
        #
        # PYSEC-2025-183 / CVE-2025-45768 is a disputed PyJWT HMAC key-length
        # advisory with no fixed release in the audit database. DAP documents
        # 32+ byte JWT secrets for deployments and generates a 32-byte random
        # fallback when no explicit secret is supplied, so keep the scanner
        # active while ignoring only this advisory.
        run: uv run pip-audit --ignore-vuln PYSEC-2025-183

  dashboard:
    name: Dashboard (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        run: uv python install

      - name: Install Python workspace (frozen)
        run: uv sync --all-packages --frozen

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API types
        run: pnpm check:api

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
