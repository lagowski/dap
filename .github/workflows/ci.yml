name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR/branch when new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  UV_VERSION: "0.8.15"
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      run_python: ${{ steps.paths.outputs.run_python }}
      run_python_smoke: ${{ steps.paths.outputs.run_python_smoke }}
      run_pip_audit: ${{ steps.paths.outputs.run_pip_audit }}
      run_dashboard: ${{ steps.paths.outputs.run_dashboard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Classify PR paths
        id: paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Pushes do not have a PR file list, so they run the full CI gate.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            {
              echo "run_python=true"
              echo "run_python_smoke=true"
              echo "run_pip_audit=true"
              echo "run_dashboard=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files_output="$(mktemp)"
          trap 'rm -f "$files_output"' EXIT
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > "$files_output"; then
            echo "::warning::Could not fetch PR file list; running all CI jobs."
            {
              echo "run_python=true"
              echo "run_python_smoke=true"
              echo "run_pip_audit=true"
              echo "run_dashboard=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Path policy:
          # - docs-only PRs keep stable check names but skip Python, audit and dashboard work;
          # - dashboard-only PRs skip Python smoke unless engine/OpenAPI contracts changed;
          # - backend-only PRs skip dashboard build unless generated API types may be affected.
          python3 .github/scripts/classify_ci_paths.py "$files_output" >> "$GITHUB_OUTPUT"

  python:
    # NOTE: name kept stable — GitHub branch protection references it.
    # Steps below cover ruff, mypy and the fast pytest gate.
    # If classification fails, run the full job instead of skipping CI.
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    needs: classify
    if: always()

    steps:
      - name: Skip Python checks
        if: needs.classify.result == 'success' && needs.classify.outputs.run_python != 'true'
        run: echo "Python checks skipped by path policy for this PR."

      - name: Checkout
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python == 'true'
        uses: actions/checkout@v6

      - name: Install uv
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python == 'true'
        run: uv python install

      # Guard against source/lock drift (#645): dependabot's uv group can bump
      # uv.lock without widening the source pyproject.toml constraints (or vice
      # versa). `uv lock --check` fails if uv.lock is not consistent with every
      # pyproject.toml, so the mismatch surfaces here instead of silently
      # reverting on the next fresh `uv lock`.
      - name: Lockfile drift guard (uv lock --check)
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python == 'true'
        run: uv lock --check

      - name: Install workspace (frozen)
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python == 'true'
        run: uv sync --all-packages --frozen

      - name: Ruff lint
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python == 'true'
        run: uv run ruff check apps packages tests

      - name: Ruff format check
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python == 'true'
        run: uv run ruff format --check apps packages tests

      - name: Mypy
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python == 'true'
        run: uv run mypy apps packages tests

      - name: Pytest
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python == 'true'
        # Fast required gate: all non-integration Python tests plus
        # smoke files tagged ``unit`` by ``tests/smoke/conftest.py``.
        # Heavier smoke tests run in the sharded job below.
        # ``--cov-fail-under=55`` is a regression floor for the unit-only
        # gate (60% as of #778 Phase 5; the FULL suite measures 87% and is
        # tracked on Codecov). Ratchet the floor up as unit coverage grows —
        # never down.
        run: uv run pytest -q -m "not integration" --ignore=tests/standalone --cov=apps --cov=packages --cov-report=xml --cov-fail-under=55

      - name: Upload coverage to Codecov
        # Informational only — never fail the required gate on a missing token
        # or a Codecov outage (fail_ci_if_error: false).
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-smoke:
    name: Python smoke integration (${{ matrix.shard_name }})
    runs-on: ubuntu-latest
    needs: classify
    # If classification fails, run the full job instead of skipping CI.
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_name: "1/3"
          - shard_index: 1
            shard_name: "2/3"
          - shard_index: 2
            shard_name: "3/3"

    steps:
      - name: Skip Python smoke integration
        if: needs.classify.result == 'success' && needs.classify.outputs.run_python_smoke != 'true'
        run: echo "Python smoke integration skipped by path policy for this PR."

      - name: Checkout
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python_smoke == 'true'
        uses: actions/checkout@v6

      - name: Install uv
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python_smoke == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python_smoke == 'true'
        run: uv python install

      - name: Install workspace (frozen)
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python_smoke == 'true'
        run: uv sync --all-packages --frozen

      - name: Pytest smoke integration shard
        if: needs.classify.result != 'success' || needs.classify.outputs.run_python_smoke == 'true'
        run: |
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(uv run python .github/scripts/select_pytest_files.py tests/smoke --total 3 --index ${{ matrix.shard_index }})
          uv run pytest -q -m integration "${files[@]}"

  pip-audit:
    name: Python deps CVE scan
    runs-on: ubuntu-latest
    needs: classify
    # If classification fails, run the full job instead of skipping CI.
    if: always()

    steps:
      - name: Skip Python dependency audit
        if: needs.classify.result == 'success' && needs.classify.outputs.run_pip_audit != 'true'
        run: echo "Python dependency audit skipped by path policy for this PR."

      - name: Checkout
        if: needs.classify.result != 'success' || needs.classify.outputs.run_pip_audit == 'true'
        uses: actions/checkout@v6

      - name: Install uv
        if: needs.classify.result != 'success' || needs.classify.outputs.run_pip_audit == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        if: needs.classify.result != 'success' || needs.classify.outputs.run_pip_audit == 'true'
        run: uv python install

      - name: Install workspace (frozen)
        if: needs.classify.result != 'success' || needs.classify.outputs.run_pip_audit == 'true'
        run: uv sync --all-packages --frozen

      - name: pip-audit
        if: needs.classify.result != 'success' || needs.classify.outputs.run_pip_audit == 'true'
        # Audits the synced venv (uv.lock-frozen). Workspace packages
        # (dap-*) are skipped as expected — they are local, not
        # on PyPI. CVE detection covers all transitive dependencies.
        #
        # PYSEC-2025-183 / CVE-2025-45768 is a disputed PyJWT HMAC key-length
        # advisory with no fixed release in the audit database. DAP documents
        # 32+ byte JWT secrets for deployments and generates a 32-byte random
        # fallback when no explicit secret is supplied, so keep the scanner
        # active while ignoring only this advisory.
        run: uv run pip-audit --ignore-vuln PYSEC-2025-183

  dashboard:
    name: Dashboard (typecheck + build)
    runs-on: ubuntu-latest
    needs: classify
    # If classification fails, run the full job instead of skipping CI.
    if: always()
    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Skip dashboard checks
        if: needs.classify.result == 'success' && needs.classify.outputs.run_dashboard != 'true'
        working-directory: .
        run: echo "Dashboard checks skipped by path policy for this PR."

      - name: Checkout
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        uses: actions/checkout@v6

      - name: Install uv
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        run: uv python install

      - name: Install Python workspace (frozen)
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        run: uv sync --all-packages --frozen

      - name: Setup pnpm
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - name: Install dependencies
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check generated API types
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        run: pnpm check:api

      - name: Typecheck
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        run: pnpm typecheck

      - name: Lint
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        run: pnpm lint

      - name: Test
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        # --coverage only adds reporting; the same vitest suite runs.
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        # Informational only — never fail the required gate on a missing token
        # or a Codecov outage (fail_ci_if_error: false).
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: apps/dashboard/coverage/lcov.info
          flags: dashboard
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        if: needs.classify.result != 'success' || needs.classify.outputs.run_dashboard == 'true'
        run: pnpm build
