name: CodeQL

# PATHS-IGNORE IS SAFE HERE: `Analyze (...)` is not a required status check on either
# branch (develop requires Python / Dashboard / Playwright smoke; main adds `Verify PR
# source is develop` and `gemini-review`). Nothing waits for it, so the workflow can be
# filtered out of the run entirely. ci.yml / e2e.yml / docker-build.yml do NOT get this
# treatment -- their checks ARE required, and they already start-and-exit-early through
# the classify job in .github/scripts/classify_ci_paths.py.
#
# The weekly cron below is untouched, so unchanged code is still scanned on schedule --
# that is what makes skipping a workflow-only PR here cost nothing in coverage.
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '.github/workflows/copilot-comment-responder.yml'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '.github/workflows/copilot-comment-responder.yml'
  schedule:
    # Weekly scan (Mondays 06:17 UTC) to catch advisories on unchanged code.
    - cron: "17 6 * * 1"

# Cancel in-progress runs for the same PR/branch when new push lands.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # CodeQL requires a GitHub-hosted runner; matches the python/dashboard jobs.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
