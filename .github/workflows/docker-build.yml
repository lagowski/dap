name: Docker build

# Build + smoke-test the standalone Docker image on every PR that
# touches packaging-relevant files. **Doesn't push** — that lands in
# the release workflow (D3) once it's wired.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - apps/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker-build.yml
  push:
    branches: [develop]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - apps/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker-build.yml

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      # Build only — no registry login, no push. Caches via GitHub
      # Actions cache backend so re-runs on the same PR finish fast.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dap:pr-${{ github.event.pull_request.number || 'develop' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke: start the container with a throwaway JWT secret + SQLite,
      # wait for the healthcheck to pass, then check /health responds.
      - name: Smoke test — engine /health
        env:
          IMAGE_TAG: dap:pr-${{ github.event.pull_request.number || 'develop' }}
        run: |
          set -euo pipefail
          SECRET="$(openssl rand -hex 32)"
          # Map both ports to ephemeral host ports — gives the test a
          # stable handle without conflicting with anything else on the
          # runner.
          CID=$(docker run -d \
            -e DAP_AUTH_JWT_SECRET="${SECRET}" \
            -p 17333:7333 \
            -p 13000:3000 \
            "${IMAGE_TAG}")
          echo "Container started: ${CID}"

          # Engine /health usually responds in <5s, but cold migrations
          # can push it past that. Poll for up to 90s before declaring
          # failure.
          deadline=$((SECONDS + 90))
          while (( SECONDS < deadline )); do
              if curl --silent --fail http://127.0.0.1:17333/health > /dev/null; then
                  echo "Engine /health responded OK after $((SECONDS))s."
                  break
              fi
              sleep 2
          done

          if (( SECONDS >= deadline )); then
              echo "::error::Engine /health did not respond within 90s"
              docker logs "${CID}"
              docker rm -f "${CID}" || true
              exit 1
          fi

          # Dashboard is served by Next standalone — /login is a static
          # page that hits no engine state, so it's a good readiness probe.
          if ! curl --silent --fail http://127.0.0.1:13000/login > /dev/null; then
              echo "::error::Dashboard /login did not respond"
              docker logs "${CID}"
              docker rm -f "${CID}" || true
              exit 1
          fi

          # Container is healthy: assert the docker healthcheck agrees.
          status="$(docker inspect --format '{{.State.Health.Status}}' "${CID}" 2>/dev/null || echo "(no healthcheck)")"
          echo "Docker healthcheck status: ${status}"

          docker rm -f "${CID}"

      - name: Verify image runs as non-root
        env:
          IMAGE_TAG: dap:pr-${{ github.event.pull_request.number || 'develop' }}
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint=id "${IMAGE_TAG}" -u)
          if [[ "${uid}" == "0" ]]; then
              echo "::error::Image is running as root (uid=0)"
              exit 1
          fi
          echo "Image runs as uid=${uid} ✓"
