name: Packaging

# Build + smoke-test the standalone Docker image AND the dap-cli
# wheel-with-dashboard on packaging-relevant PRs. Low-risk PRs still
# get stable check names, but path policy skips the expensive work.
# **Doesn't push** — that lands in the release workflow (D3) once it's wired.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - apps/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - scripts/build-dashboard-bundle.sh
      - tests/standalone/**
      - .github/workflows/docker-build.yml
      - .github/scripts/classify_ci_paths.py

permissions:
  contents: read
  pull-requests: read

env:
  UV_VERSION: "0.8.15"
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify packaging paths
    runs-on: ubuntu-latest
    outputs:
      run_docker: ${{ steps.paths.outputs.run_docker }}
      run_bundle_wheel: ${{ steps.paths.outputs.run_bundle_wheel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Classify PR paths
        id: paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Pushes to develop publish no image here, but still validate packaging.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            {
              echo "run_docker=true"
              echo "run_bundle_wheel=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files_output="$(mktemp)"
          trap 'rm -f "$files_output"' EXIT
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > "$files_output"; then
            echo "::warning::Could not fetch PR file list; running packaging checks."
            {
              echo "run_docker=true"
              echo "run_bundle_wheel=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Path policy: docs-only PRs keep the required Packaging check names
          # green without paying for Docker image and wheel bundle builds.
          python3 .github/scripts/classify_ci_paths.py "$files_output" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: classify
    # If classification fails, run the full job instead of skipping packaging CI.
    if: always()

    steps:
      - name: Skip Docker build
        if: needs.classify.result == 'success' && needs.classify.outputs.run_docker != 'true'
        run: echo "Docker build skipped by path policy for this PR."

      - uses: actions/checkout@v6
        if: needs.classify.result != 'success' || needs.classify.outputs.run_docker == 'true'

      - name: Set up Docker buildx
        if: needs.classify.result != 'success' || needs.classify.outputs.run_docker == 'true'
        uses: docker/setup-buildx-action@v4

      # Build only — no registry login, no push. Caches via GitHub
      # Actions cache backend so re-runs on the same PR finish fast.
      - name: Build image
        if: needs.classify.result != 'success' || needs.classify.outputs.run_docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dap:pr-${{ github.event.pull_request.number || 'develop' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke: start the container with a throwaway JWT secret + SQLite,
      # wait for the healthcheck to pass, then check /health responds.
      - name: Smoke test — engine /health
        if: needs.classify.result != 'success' || needs.classify.outputs.run_docker == 'true'
        env:
          IMAGE_TAG: dap:pr-${{ github.event.pull_request.number || 'develop' }}
        run: |
          set -euo pipefail
          SECRET="$(openssl rand -hex 32)"
          # Map both ports to ephemeral host ports — gives the test a
          # stable handle without conflicting with anything else on the
          # runner.
          CID=$(docker run -d \
            -e DAP_AUTH_JWT_SECRET="${SECRET}" \
            -p 17333:7333 \
            -p 13000:3000 \
            "${IMAGE_TAG}")
          echo "Container started: ${CID}"

          # Engine /health usually responds in <5s, but cold migrations
          # can push it past that. Poll for up to 90s before declaring
          # failure.
          deadline=$((SECONDS + 90))
          while (( SECONDS < deadline )); do
              if curl --silent --fail http://127.0.0.1:17333/health > /dev/null; then
                  echo "Engine /health responded OK after $((SECONDS))s."
                  break
              fi
              sleep 2
          done

          if (( SECONDS >= deadline )); then
              echo "::error::Engine /health did not respond within 90s"
              docker logs "${CID}"
              docker rm -f "${CID}" || true
              exit 1
          fi

          # Dashboard is served by Next standalone — /login is a static
          # page that hits no engine state, so it's a good readiness probe.
          if ! curl --silent --fail http://127.0.0.1:13000/login > /dev/null; then
              echo "::error::Dashboard /login did not respond"
              docker logs "${CID}"
              docker rm -f "${CID}" || true
              exit 1
          fi

          # Container is healthy: assert the docker healthcheck agrees.
          # The healthcheck has a 30s ``start_period`` + 30s ``interval``,
          # so a freshly-started container can still report ``starting``
          # at this point. Poll for up to 60s for it to flip to ``healthy``
          # before failing — that way a flaky cold start doesn't mask the
          # real assertion ("the healthcheck never goes green").
          deadline=$((SECONDS + 60))
          status="starting"
          while (( SECONDS < deadline )); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "${CID}" 2>/dev/null || echo "(no healthcheck)")"
              if [[ "${status}" == "healthy" ]]; then
                  echo "Docker healthcheck status: healthy ✓"
                  break
              fi
              sleep 2
          done
          if [[ "${status}" != "healthy" ]]; then
              echo "::error::Docker healthcheck did not reach 'healthy' (last status: ${status})"
              docker logs "${CID}"
              docker rm -f "${CID}" || true
              exit 1
          fi

          docker rm -f "${CID}"

      - name: Verify image runs as non-root
        if: needs.classify.result != 'success' || needs.classify.outputs.run_docker == 'true'
        env:
          IMAGE_TAG: dap:pr-${{ github.event.pull_request.number || 'develop' }}
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint=id "${IMAGE_TAG}" -u)
          if [[ "${uid}" == "0" ]]; then
              echo "::error::Image is running as root (uid=0)"
              exit 1
          fi
          echo "Image runs as uid=${uid} ✓"

  bundle-wheel:
    # Validates the dap-cli wheel ships the dashboard bundle (D2,
    # #334). Same trigger as the docker build because both consume
    # ``apps/dashboard/`` and the bundle script.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: classify
    # If classification fails, run the full job instead of skipping packaging CI.
    if: always()
    steps:
      - name: Skip wheel bundle check
        if: needs.classify.result == 'success' && needs.classify.outputs.run_bundle_wheel != 'true'
        run: echo "Wheel bundle check skipped by path policy for this PR."

      - uses: actions/checkout@v6
        if: needs.classify.result != 'success' || needs.classify.outputs.run_bundle_wheel == 'true'

      - uses: actions/setup-node@v6
        if: needs.classify.result != 'success' || needs.classify.outputs.run_bundle_wheel == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        if: needs.classify.result != 'success' || needs.classify.outputs.run_bundle_wheel == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: astral-sh/setup-uv@v7
        if: needs.classify.result != 'success' || needs.classify.outputs.run_bundle_wheel == 'true'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python toolchain
        if: needs.classify.result != 'success' || needs.classify.outputs.run_bundle_wheel == 'true'
        # ``--all-packages`` installs every workspace member (dap-cli,
        # dap-engine, …) so the standalone tests can ``import dap_cli``.
        # Without it, ``uv sync`` only installs third-party deps and
        # the test collection errors with ``ModuleNotFoundError``.
        run: uv sync --frozen --dev --all-packages

      - name: Build dashboard bundle + dap-cli wheel + smoke test
        if: needs.classify.result != 'success' || needs.classify.outputs.run_bundle_wheel == 'true'
        run: uv run pytest tests/standalone/ -v
