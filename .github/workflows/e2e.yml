name: E2E

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  UV_VERSION: "0.8.15"
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  classify:
    name: Classify e2e paths
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.paths.outputs.run_e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Classify PR paths
        id: paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Scheduled and manual runs are explicit full e2e validations.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files_output="$(mktemp)"
          trap 'rm -f "$files_output"' EXIT
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > "$files_output"; then
            echo "::warning::Could not fetch PR file list; running e2e checks."
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Path policy: docs-only PRs keep the Playwright check name stable
          # but skip browser install and test execution.
          python3 .github/scripts/classify_ci_paths.py "$files_output" >> "$GITHUB_OUTPUT"

  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: classify
    # If classification fails, run the full job instead of skipping e2e CI.
    if: always()

    steps:
      - name: Skip Playwright smoke
        if: needs.classify.result == 'success' && needs.classify.outputs.run_e2e != 'true'
        run: echo "Playwright smoke skipped by path policy for this PR."

      - name: Checkout
        if: needs.classify.result != 'success' || needs.classify.outputs.run_e2e == 'true'
        uses: actions/checkout@v7

      - name: Install uv
        if: needs.classify.result != 'success' || needs.classify.outputs.run_e2e == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        if: needs.classify.result != 'success' || needs.classify.outputs.run_e2e == 'true'
        run: uv python install

      - name: Install Python workspace
        if: needs.classify.result != 'success' || needs.classify.outputs.run_e2e == 'true'
        run: uv sync --all-packages --frozen

      - name: Setup pnpm
        if: needs.classify.result != 'success' || needs.classify.outputs.run_e2e == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        if: needs.classify.result != 'success' || needs.classify.outputs.run_e2e == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        if: needs.classify.result != 'success' || needs.classify.outputs.run_e2e == 'true'
        run: pnpm --dir apps/dashboard install --frozen-lockfile

      - name: Install e2e dependencies
        if: needs.classify.result != 'success' || needs.classify.outputs.run_e2e == 'true'
        run: npm ci
        working-directory: e2e

      - name: Install Playwright Chromium
        if: needs.classify.result != 'success' || needs.classify.outputs.run_e2e == 'true'
        run: npm --prefix e2e exec playwright install --with-deps chromium

      - name: Run smoke e2e
        if: needs.classify.result != 'success' || needs.classify.outputs.run_e2e == 'true'
        run: npm --prefix e2e run test:smoke

      - name: Upload Playwright report
        if: always() && (needs.classify.result != 'success' || needs.classify.outputs.run_e2e == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  full:
    name: Playwright full
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Pin Python from .python-version
        run: uv python install

      - name: Install Python workspace
        run: uv sync --all-packages --frozen

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm --dir apps/dashboard install --frozen-lockfile

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      - name: Install Playwright Chromium
        run: npm --prefix e2e exec playwright install --with-deps chromium

      - name: Run full e2e
        run: npm --prefix e2e test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
