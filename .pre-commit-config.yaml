# Pre-commit hooks: same checks as CI, run locally before each commit.
# Install once after cloning the repo:
#
#   git config core.hooksPath .githooks    # pre-push hook from .githooks/
#   uv tool install pre-commit
#   pre-commit install                     # picks up the configured hooksPath
#
# To run all hooks against the entire tree (mimics CI):
#
#   pre-commit run --all-files
#
# See CONTRIBUTING.md ("Lokalne zabezpieczenia") for details.

minimum_pre_commit_version: "3.0.0"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        name: ruff lint (autofix)
        args: [--fix]
      - id: ruff-format
        name: ruff format

  - repo: local
    hooks:
      # mypy is a local hook (not the upstream mirror) because --strict
      # needs the workspace deps (dap-types, dap-runtimes, etc.) on the
      # PYTHONPATH. The upstream mirror runs mypy in an isolated env
      # without our packages → false positives.
      - id: mypy
        name: mypy (uv strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [apps, packages, tests]

  - repo: meta
    hooks:
      # Sanity: every configured hook must apply to at least one file.
      - id: check-hooks-apply
      # Sanity: configured exclude patterns must actually match files.
      - id: check-useless-excludes
