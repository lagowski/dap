[project]
name = "dap-cli"
version = "0.4.1"
description = "DAP CLI launcher (dap init / start / stop / status)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Rafał Łagowski" },
    { name = "Daniel Łagowski" },
]
dependencies = [
    "dap-engine>=0.4,<0.5",
    "typer>=0.27.1",
    "rich>=13.9.2",
    "uvicorn[standard]>=0.52.1",
    "psutil>=6.1.0",
    "httpx>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/lagowski/dap"
Repository = "https://github.com/lagowski/dap"
Issues = "https://github.com/lagowski/dap/issues"
"Author — Rafał Łagowski" = "https://www.linkedin.com/in/rafallagowski/"
"Author — Daniel Łagowski" = "https://www.linkedin.com/in/daniellagowski/"

[project.scripts]
dap = "dap_cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dap_cli"]
# Exclude the bundle from the standard package collection so it's
# only carried by the ``force-include`` block below — otherwise
# hatchling adds the same paths twice and the wheel gets duplicate
# entries (UserWarning: Duplicate name).
exclude = [
    "src/dap_cli/_dashboard",
    "src/dap_cli/_dashboard/**",
]

# Include the dashboard bundle (#302 sub-D2) when it's present.
# Built on demand by ``scripts/build-dashboard-bundle.sh`` —
# gitignored, so dev wheels built without running the script ship
# only the ``.gitkeep`` placeholder (``dap start`` falls back to a
# friendly "dashboard not bundled" message). The release pipeline
# (D3) always runs the bundler before ``uv build``.
[tool.hatch.build.targets.wheel.force-include]
"src/dap_cli/_dashboard" = "dap_cli/_dashboard"

# ``dap demo`` (#1042) ships examples/python-func-pipeline as dap_cli/_demo:
# hatch_build.py adds it from a checkout; a wheel built from the sdist gets it
# from the copy the sdist carries (below).
[tool.hatch.build.targets.wheel.hooks.custom]

# Same rule for the sdist so ``uv pip install dap-cli`` from a
# source distribution still has the bundle.
[tool.hatch.build.targets.sdist]
include = [
    "src/dap_cli",
    "README.md",
    "hatch_build.py",
]

[tool.hatch.build.targets.sdist.force-include]
"../../examples/python-func-pipeline/example.pipeline-bundle.json" = "src/dap_cli/_demo/example.pipeline-bundle.json"
"../../examples/python-func-pipeline/examplepipe/__init__.py" = "src/dap_cli/_demo/examplepipe/__init__.py"
"../../examples/python-func-pipeline/examplepipe/nodes.py" = "src/dap_cli/_demo/examplepipe/nodes.py"
"../../examples/python-func-pipeline/examplepipe/gates.py" = "src/dap_cli/_demo/examplepipe/gates.py"
