[project]
name = "dap-cli"
version = "0.3.0"
description = "DAP CLI launcher (dap init / start / stop / status)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Rafał Łagowski", email = "rafal@lagowski.es" },
    { name = "Daniel Łagowski", email = "daniel@lagowski.es" },
]
dependencies = [
    "dap-engine>=0.3,<0.4",
    "typer>=0.12.5",
    "rich>=13.9.2",
    "uvicorn[standard]>=0.32.0",
    "psutil>=6.1.0",
    "httpx>=0.27.2",
]

[project.scripts]
dap = "dap_cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dap_cli"]
# Exclude the bundle from the standard package collection so it's
# only carried by the ``force-include`` block below — otherwise
# hatchling adds the same paths twice and the wheel gets duplicate
# entries (UserWarning: Duplicate name).
exclude = [
    "src/dap_cli/_dashboard",
    "src/dap_cli/_dashboard/**",
]

# Include the dashboard bundle (#302 sub-D2) when it's present.
# Built on demand by ``scripts/build-dashboard-bundle.sh`` —
# gitignored, so dev wheels built without running the script ship
# only the ``.gitkeep`` placeholder (``dap start`` falls back to a
# friendly "dashboard not bundled" message). The release pipeline
# (D3) always runs the bundler before ``uv build``.
[tool.hatch.build.targets.wheel.force-include]
"src/dap_cli/_dashboard" = "dap_cli/_dashboard"

# Same rule for the sdist so ``uv pip install dap-cli`` from a
# source distribution still has the bundle.
[tool.hatch.build.targets.sdist]
include = [
    "src/dap_cli",
    "README.md",
]
