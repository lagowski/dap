# Alembic config for DAP engine (audit E6).
#
# Used by the ``alembic`` CLI when invoked from ``apps/engine/`` —
# e.g. ``cd apps/engine && alembic revision --autogenerate -m "msg"``
# generates a new revision under
# ``src/dap_engine/alembic/versions/``.
#
# Runtime migration application does NOT use this file; the engine
# constructs a ``Config()`` programmatically in
# ``persistence/db.py::_apply_alembic_migrations`` so the wheel works
# without a sidecar ini. This file exists for the developer-facing
# ``alembic`` CLI flow only.

[alembic]
# Migrations live INSIDE the package so the wheel ships them. The
# ``%(here)s`` placeholder resolves to ``apps/engine/`` so the path
# is correct regardless of where the CLI is invoked from.
script_location = %(here)s/src/dap_engine/alembic

# Default DB used by the ``alembic`` CLI for migration generation.
# Overridden at runtime by ``Config().set_main_option("sqlalchemy.url",
# url)`` in ``_apply_alembic_migrations``. For the CLI, this points at
# a throwaway dev SQLite path so ``--autogenerate`` can introspect.
sqlalchemy.url = sqlite:///./.dap/alembic-dev.db

# Use timestamp-prefixed slugs for new revisions; matches the existing
# ``001_runs_add_project_id`` naming convention from MIGRATIONS[].
file_template = %%(rev)s_%%(slug)s

# Python path additions so env.py can resolve ``dap_engine.*`` from a
# checked-out workspace. ``alembic`` CLI auto-adds %(here)s.
prepend_sys_path = src

# Force UTC timestamps in revision IDs for deterministic ordering
# across timezones.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
