[project]
name = "dap-engine"
version = "0.3.0"
description = "DAP engine — FastAPI + LangGraph + SQLAlchemy + SQLite / PostgreSQL"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Rafał Łagowski" },
    { name = "Daniel Łagowski" },
]
dependencies = [
    "dap-schemas>=0.3,<0.4",
    "dap-runtimes[all]>=0.3,<0.4",
    "dap-prompt-dsl>=0.3,<0.4",
    "dap-database>=0.3,<0.4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "pydantic>=2.9.2",
    "anyio>=4.6.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "packaging>=24.0",
    # PostgreSQL backend (optional — only used when DAP_DATABASE_URL points to pg)
    "psycopg[binary,pool]>=3.3.4",
    "langgraph-checkpoint-postgres>=2.0",
    # Auth (v0.3 — see #299).
    # `fastapi-users[sqlalchemy]` pulls aiosqlite already; the `oauth`
    # extra adds httpx-oauth for the GitHub + Google providers wired in
    # the OAuth sub-PR. Explicit pin so `--frozen` installs catch
    # breaking minor bumps in pre-commit hooks.
    "fastapi-users[sqlalchemy,oauth]>=15.0.5",
    # PyJWT — transitive of fastapi-users, but constrained explicitly to
    # >=2.13.0 to pull in the 2026-06 security patches that close
    # PYSEC-2026-175/-177/-178/-179 (4 CVEs in 2.12.1). Without this
    # constraint, uv resolves fastapi-users' looser bound to 2.12.1 and
    # the pip-audit CI gate fails. The ``[crypto]`` extra matches the
    # transitive resolution shape so the install surface isn't widened.
    "pyjwt[crypto]>=2.13.0",
    # At-rest encryption for instance env-var values (#388). Already
    # pulled transitively by fastapi-users, but declared explicitly so
    # the dependency is visible to anyone auditing what we encrypt
    # with and which version of Fernet we rely on.
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/lagowski/dap"
Repository = "https://github.com/lagowski/dap"
Issues = "https://github.com/lagowski/dap/issues"
"Author — Rafał Łagowski" = "https://www.linkedin.com/in/rafallagowski/"
"Author — Daniel Łagowski" = "https://www.linkedin.com/in/daniellagowski/"

[project.scripts]
dap-engine = "dap_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dap_engine"]
