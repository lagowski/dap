[project]
name = "dap-engine"
version = "0.3.0"
description = "DAP engine — FastAPI + LangGraph + SQLAlchemy + SQLite / PostgreSQL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dap-schemas",
    "dap-runtimes",
    "dap-prompt-dsl",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "pydantic>=2.9.2",
    "anyio>=4.6.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0.0",
    # PostgreSQL backend (optional — only used when DAP_DATABASE_URL points to pg)
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    # Auth (v0.3 — see #299).
    # `fastapi-users[sqlalchemy]` pulls aiosqlite already; the `oauth`
    # extra adds httpx-oauth for the GitHub + Google providers wired in
    # the OAuth sub-PR. Explicit pin so `--frozen` installs catch
    # breaking minor bumps in pre-commit hooks.
    "fastapi-users[sqlalchemy,oauth]>=15.0.5",
    # At-rest encryption for instance env-var values (#388). Already
    # pulled transitively by fastapi-users, but declared explicitly so
    # the dependency is visible to anyone auditing what we encrypt
    # with and which version of Fernet we rely on.
    "cryptography>=42.0",
]

[project.scripts]
dap-engine = "dap_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dap_engine"]
