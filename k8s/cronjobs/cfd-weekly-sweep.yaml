apiVersion: batch/v1
kind: CronJob
metadata:
  name: cfd-sweep-weekly
  namespace: trading
spec:
  schedule: "0 2 * * 6"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: cfd-research
            image: ghcr.io/dixter999/cfd-research:latest
            args: ["cfd.sweep", "--watchlist", "all-cfd"]
            envFrom:
            - secretRef:
                name: cfd-research-env
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"
          imagePullSecrets:
          - name: ghcr-pull-secret
