[project]
name = "code-review-council"
version = "0.1.0"
description = "Multi-agent code review with anti-hallucination filtering"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "TBD" }
dependencies = [
    # Google Gen AI SDK — current/non-deprecated. ``google-generativeai``
    # is the older package and Google has marked it deprecated.
    "google-genai>=1.33.0,<2.0",
    "pydantic>=2.9.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_council"]
