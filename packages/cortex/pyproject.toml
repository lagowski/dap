[project]
name = "cortex"
version = "0.0.1"
description = "Cortex pipeline nodes — runs inside DAP engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dap-types",
    "dap-runtimes",
    "pygithub>=2.5",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
    "msgpack>=1.1",
    "psycopg-pool>=3.3.0",
    "langchain-core>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]
