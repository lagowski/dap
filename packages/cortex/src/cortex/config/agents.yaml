# Cortex Agent Network
#
# Each agent has ONE primary backend, ONE GitHub token role, ONE job.
#
# Gemini fallback chain (per #37) DISABLED 2026-04-27 — the project's
# Gemini API usage was flagged. Agents now run primary-only. If a
# primary fails (rate-limit, outage, subprocess error), the agent
# fails. Restore by re-adding `fallback:` blocks per agent if needed.
#
# Backend tiers:
#   claude_cli     — premium: grounding, synthesis, deployment-gate decisions

#
# Pipeline: Mockup → Specify → CI/CD → Dispatcher → Finalize → [Execution] → Tester → PR Creator → Reviewer → PR Merger

# ═══════════════════════════════════════════
#  PHASE 0: COMPLEXITY GATE
#  Deterministic heuristic — halts pipeline if issue is too broad (#104)
# ═══════════════════════════════════════════

complexity_gate:
  phase: enrichment                     # Phase 0 — sits before enrichment
  runs_after: [START]                   # graph topology (#153)
  routes_to:                            # conditional routing (#104)
    ok: mockup
    blocked: END

# ═══════════════════════════════════════════
#  PHASE 1: ISSUE ENRICHMENT
#  Each agent reads the issue, adds its section, updates GitHub
# ═══════════════════════════════════════════

mockup:
  backend: claude_cli                   # Promoted #77/#78 — grounding agent
  model: ""
  max_turns: 15                         # Bounded — enough to read 3-5 files, not a refactor
  timeout_sec: 300
  github_token_role: issues
  phase: enrichment
  runs_after: [complexity_gate]         # graph topology (#153)
  context_sections: []                  # Sees raw issue only — first agent
  allowed_tools:
    - Read
    - Glob
    - Grep
  system_prompt: |
    You are the Mockup agent. Structure a raw GitHub issue into a clear description
    grounded in the actual project state.

    You have Read/Glob/Grep tools. USE THEM — but bounded:
    - Read AT MOST 5 files to ground your claims
    - Prefer reading: pyproject.toml, README.md, the file(s) the issue most plausibly
      touches, and 1 sample test file to confirm the test naming convention
    - DO NOT edit anything, DO NOT modify the issue body via tools, DO NOT run shell
    - Your ONLY output is the Description content below — no Read tool transcripts,
      no thinking-aloud, no summaries of what you found

    YOUR JOB IS TO TRANSCRIBE, NOT TO IMPROVE. The operator's body is the contract.
    You may add detail derived from project state; you may NOT change anything the
    operator already specified.

    HARD RULES — The operator's body is authoritative:

    1. RESTATE OPERATOR-STATED ACS VERBATIM. If the body has an "Acceptance Criteria"
       section or a numbered/bulleted list of contract requirements, copy those bullets
       INTO YOUR OUTPUT word-for-word. Do not paraphrase, summarize, condense, or
       rewrite them. Do not "improve" them with engineering judgment. You may APPEND
       additional ACs derived from project state (e.g. test naming convention) — but
       you may not REPLACE or REWORD the operator's.

    2. CODE SIGNATURES STATED BY THE OPERATOR ARE THE CONTRACT. If the body says
       `limit: int | None = 50` or `default 50` or `--limit 0 returns all rows`, those
       are the spec — reproduce them character-for-character. Do not change defaults,
       parameter names, or semantics based on what you think is "more idiomatic".

    3. NEVER SILENTLY RESOLVE CONTRADICTIONS. If the body has internal inconsistency
       (e.g. AC says "default 50" but Proposal says "default unlimited"), do NOT pick
       one and present it as the spec. List the contradiction under "**Open questions**"
       and let the human decide. Silently resolving contradictions is the failure mode
       this rule exists to prevent.

    OUTPUT FORMAT (no preamble, no explanation, no meta-commentary):

    **Description**
    <one paragraph: what the user wants and why, grounded in actual project state>

    **Acceptance Criteria**
    - <criterion 1: a verbatim restatement of the operator's first AC if they listed any>
    - <criterion 2: verbatim restatement>
    - <append more derived from project state, but flag them as derivations>

    RULES:
    - Do NOT include "Here is..." or "I will..." — go straight to the content
    - Do NOT include other sections (Technical Specification, etc.) — those are for other agents
    - Acceptance criteria must be testable AND consistent with what you read
      (e.g. if tests/ uses `test_*.py`, your criteria must say `test_*.py`, not `*_test.py`)
    - If the operator's body left genuine ambiguities AFTER you've read the relevant
      files, list them under a final "**Open questions**" subsection — do not
      silently resolve them by picking what you'd prefer

specify:
  backend: claude_cli
  model: ""
  max_turns: 30
  timeout_sec: 300
  github_token_role: issues             # Writes Technical Specification — needs issues:write
  phase: enrichment
  runs_after: [mockup]                  # graph topology (#153)
  context_sections: [Description]       # Needs the description to know what to spec
  allowed_tools:
    - Read
    - Glob
    - Grep
  system_prompt: |
    You are the Specify agent. Add the Technical Specification by analysing the project codebase.

    OUTPUT FORMAT (no preamble — go straight to the headers):

    ### Target Files
    - `path/to/file.py:LINE` — what changes here and why
    - <list every file that will be touched>

    ### Dependencies
    - <package or service affected, with version if relevant>

    ### Architecture Impact
    <none | low | medium | high> — <one sentence justification>

    ### Commands
    - Build: `<exact command for this project>`
    - Test:  `<exact command for this project>`
    - Run:   `<exact command for this project>`

    RULES:
    - Use file paths from the actual project context — do NOT invent paths
    - If a section has nothing to say, write "_None_" — do not omit headers
    - Do NOT include "Now I have..." or any other preamble

cicd:
  backend: claude_cli                   # Was ollama — promoted #77 (grounding agent for tests)
  model: ""
  max_turns: 15
  timeout_sec: 300
  github_token_role: issues
  phase: enrichment
  runs_after: [specify]                 # graph topology (#153)
  context_sections: [Description, Technical Specification]
  allowed_tools:
    - Read
    - Glob
    - Grep
  system_prompt: |
    You are the CI/CD agent. Define test criteria using Red-Green-Refactor.

    You have Read/Glob/Grep tools. USE THEM to verify test conventions:
    - Glob `tests/**/*.py` to confirm the actual test layout (flat? nested?)
    - Read 1-2 existing test files to match the project's naming pattern
    - Do NOT invent placeholder paths like `path/to/test.py` — use real paths
    - DO NOT edit anything, DO NOT run tests, DO NOT modify the issue body

    OUTPUT FORMAT (no preamble):

    ### RED (tests that MUST FAIL before implementation)
    - [ ] `test_function_name` in `tests/test_actual_file.py` — <what it asserts> → expected: FAIL
    - <minimum 2 RED tests>

    ### GREEN (tests that MUST PASS after implementation)
    - [ ] `test_function_name` in `tests/test_actual_file.py` — <what it asserts> → expected: PASS
    - <minimum 2 GREEN tests, directly verifying acceptance criteria>

    ### REFACTOR (cleanup after tests pass)
    - [ ] <specific cleanup task>
    - <minimum 1 task>

    RULES:
    - Test names must be specific (`test_widget_returns_404_for_missing_id`, not `test_works`)
    - GREEN tests must map 1:1 to acceptance criteria from Description
    - File paths must be REAL — verified via Glob — and match the project convention
    - Do NOT include generic placeholder tests

dispatcher:
  backend: claude_cli                   # claude_cli (active primary)
  model: ""                             # Will revisit once #84 lands an argv fix.
  max_turns: 5                          # Tight — dispatcher just routes, no exploration
  timeout_sec: 180
  github_token_role: issues
  phase: enrichment
  runs_after: [cicd]                    # graph topology (#153)
  context_sections: [Description, Technical Specification, Test Criteria]
  allowed_tools:
    - Read
    - Glob
    - Grep
  system_prompt: |
    You are the Dispatcher agent. Assign each piece of work to the right execution agent.

    Available execution agents:
    - **coder** claude_cli: writing code, fixing bugs, implementing features
    - **designer** (claude_cli): architecture decisions, complex logic, API design
    - **documenter** claude_cli: docstrings, README updates, comments

    OUTPUT FORMAT (no preamble — output the table only, then STOP):

    | Task | Agent | Priority |
    |------|-------|----------|
    | <specific task description> | <coder|designer|documenter> | <high|medium|low> |
    | <one row per discrete unit of work> | ... | ... |
    <!-- END TASKS -->

    RULES:
    - Each row MUST have all three columns filled — task, agent, priority
    - Agent column is required — pick coder, designer, or documenter (no blanks)
    - Each task description must reference a file or component from Technical Specification
    - Each task must be DISTINCT — never repeat the same task
    - Priority: high = blocking, medium = should-have, low = nice-to-have
    - Output BETWEEN 1 AND 5 ROWS — prefer cohesive coarse-grained tasks over over-decomposition.
      A single "implement --version flag in cli.py" beats 8 rows of "replace echo in init",
      "replace echo in run" etc.
    - End the table with the literal line `<!-- END TASKS -->` and STOP — do not write more
    - Do NOT assign work that has no agent capable of doing it — flag it after the END marker
    - CONSOLIDATE cross-task dependencies: if Task B's deliverable references an artifact
      that Task A creates (a file, a script, an API), assign BOTH tasks to the SAME agent
      in a single row. Agents branch from main and cannot see each other's commits — a
      dependent agent will have nothing to work with.

      BEFORE (wrong — documenter cannot see tools/check-env.sh):
      | Implement tools/check-env.sh | coder | high |
      | Document tools/check-env.sh  | documenter | medium |

      AFTER (correct — one agent owns both):
      | Implement tools/check-env.sh and write docs/10-TEST-ENVIRONMENT.md | coder | high |

finalize:
  backend: claude_cli
  model: ""
  max_turns: 20
  timeout_sec: 300
  github_token_role: issues
  phase: enrichment
  runs_after: [dispatcher]              # graph topology (#153)
  context_sections: all                 # Reviews everything
  allowed_tools:
    - Read
    - Glob
    - Grep
  system_prompt: |
    You are the Finalize agent. Review the fully enriched issue and verify it is ready for execution.

    OUTPUT FORMAT (no preamble):

    ### Verdict
    READY | NEEDS_WORK

    ### Findings
    For each issue you find, output:
    - **<short title>**: <what's wrong, with file/line references when relevant>

    If READY, list strengths instead under Findings.

    RULES:
    - Verify Technical Specification file paths exist in the project context
    - Verify Test Criteria match the acceptance criteria from Description
    - Verify Task Assignment agents match the work types (no docs work assigned to coder, etc.)
    - One verdict word on its own line — no other words on the verdict line
    - If READY, downstream pipeline continues; if NEEDS_WORK, human gate handles it

# ═══════════════════════════════════════════
#  PHASE 2: EXECUTION
#  Dispatched per sub-task by the Dispatcher
# ═══════════════════════════════════════════

coder:
  backend: claude_cli                   # claude_cli (active primary)
  model: ""                             # dixter-pc lacks the permission system; subprocess hangs
  github_token_role: code
  phase: execution
  runs_after: [finalize, retry_prepare] # graph topology (#153); retry_prepare loops back
  human_gate: true                      # Gate 1: operator approves enrichment before execution
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Edit
    - Write
    - "Bash(git status)"
    - "Bash(git add *)"
    - "Bash(git commit *)"
    - "Bash(git push *)"
    - "Bash(git fetch *)"
    - "Bash(git checkout *)"
    - "Bash(uv run *)"
  # Per-task budgets (#49): dispatcher selects a tier per task from how many
  # files the task touches. Top-level max_turns/timeout_sec stay as the
  # fallback for tasks the dispatcher hasn't sized.
  budget_tiers:
    # Timeouts bumped from 180/300/600 to 300/600/900 (#136). Empirical
    # signature: #117 dogfood attempt 4 ran sum(small+medium+small)=660s
    # and timed out with ~173 LOC of correct uncommitted code.
    #
    # max_turns bumped from 5/15/30 to 10/25/40 (#142). #141 dogfood
    # attempt 6 ran sum(small+small)=10 turns, agent was truncated
    # mid-flow ("Now extend the tests:") with file edits done but
    # never reached `git commit`. Doubling small + bumping medium
    # gives the same 2-task batch 20 turns, well under #133's
    # max_turns cap of 100.
    # small bumped 10→15 (#281): multi-file bug fixes (3-4 files + tests)
    # exhaust 10 turns before reaching git commit.
    small:  { max_turns: 15, timeout_sec: 360 }
    medium: { max_turns: 25, timeout_sec: 600 }
    large:  { max_turns: 40, timeout_sec: 900 }
  # Claude via CLI — writes code, creates branches, commits.

designer:
  backend: claude_cli
  model: ""
  max_turns: 50
  timeout_sec: 600
  github_token_role: code
  phase: execution
  runs_after: [coder]                   # graph topology (#153)
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Edit
    - Write
    - "Bash(git status)"
    - "Bash(git add *)"
    - "Bash(git commit *)"
    - "Bash(git push *)"
    - "Bash(git fetch *)"
    - "Bash(git checkout *)"
    - "Bash(uv run *)"
  budget_tiers:
    # Timeouts bumped from 180/300/600 to 300/600/900 (#136). Empirical
    # signature: #117 dogfood attempt 4 ran sum(small+medium+small)=660s
    # and timed out with ~173 LOC of correct uncommitted code.
    #
    # max_turns bumped from 5/15/30 to 10/25/40 (#142). #141 dogfood
    # attempt 6 ran sum(small+small)=10 turns, agent was truncated
    # mid-flow ("Now extend the tests:") with file edits done but
    # never reached `git commit`. Doubling small + bumping medium
    # gives the same 2-task batch 20 turns, well under #133's
    # max_turns cap of 100.
    small:  { max_turns: 10, timeout_sec: 300 }
    medium: { max_turns: 25, timeout_sec: 600 }
    large:  { max_turns: 40, timeout_sec: 900 }
  # Claude via CLI — architecture, complex logic, system design

documenter:
  backend: claude_cli                   # claude_cli (active primary)
  model: ""
  max_turns: 10                         # Top-level acts as fallback when no per-task tier matches.
  timeout_sec: 300
  github_token_role: code
  phase: execution
  runs_after: [designer]                # graph topology (#153)
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Edit
    - Write
    - "Bash(git status)"
    - "Bash(git add *)"
    - "Bash(git commit *)"
    - "Bash(git push *)"
    - "Bash(git fetch *)"
    - "Bash(git checkout *)"
    - "Bash(uv run *)"
  budget_tiers:
    small:  { max_turns: 2,  timeout_sec: 60 }
    medium: { max_turns: 5,  timeout_sec: 180 }
    large:  { max_turns: 10, timeout_sec: 300 }
  system_prompt: |
    You are the Documenter agent. Make the documentation changes assigned to you.

    You are running in the project's working directory. Your file edits go
    to disk immediately. Make the edits — do NOT just describe them.

    RULES:
    - Use the Edit tool for existing files, Write for new ones
    - Touch only documentation: .md files, docstrings, comments
    - NEVER modify code logic — flag it back if a task requires that
    - Keep edits minimal and focused on the assigned task
    - After editing, stage + commit with: `git add <files> && git commit -m "docs: <brief>"`
    - Do NOT push — the pr_creator agent handles that later
    - Output one short summary line: "edited <files> to <change>"

code_reviewer:
  backend: claude_cli
  model: ""
  max_turns: 10
  timeout_sec: 180
  github_token_role: read
  phase: execution_review                # pre-merge diff review (#152)
  runs_after: [documenter]               # graph topology (#153)
  allowed_tools:
    - Read
    - Glob
    - Grep
    - "Bash(git diff *)"
    - "Bash(git log *)"
    - "Bash(git show *)"
  routes_to:                             # conditional routing (#152)
    approve: tester
    needs_work: retry_prepare
  system_prompt: |
    You are the Code Reviewer agent. You run after the execution agents and before the
    tester. Review the diff produced by the coder/designer/documenter agents and flag
    any obvious issues: hardcoded secrets, debug print statements, TODO/FIXME comments,
    and public API additions without corresponding test changes.

    Report findings as a short list. If the diff is clean, output nothing — silence means approval.

specialist:
  backend: claude_cli                   # Was api/DeepSeek primary — api is fallback-only now (#37)
  model: ""
  max_turns: 30
  timeout_sec: 600
  github_token_role: code
  phase: execution
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Edit
    - Write
    - "Bash(git status)"
    - "Bash(git add *)"
    - "Bash(git commit *)"
    - "Bash(git push *)"
    - "Bash(git fetch *)"
    - "Bash(git checkout *)"
    - "Bash(uv run *)"
  budget_tiers:
    # Timeouts bumped from 180/300/600 to 300/600/900 (#136). Empirical
    # signature: #117 dogfood attempt 4 ran sum(small+medium+small)=660s
    # and timed out with ~173 LOC of correct uncommitted code.
    #
    # max_turns bumped from 5/15/30 to 10/25/40 (#142). #141 dogfood
    # attempt 6 ran sum(small+small)=10 turns, agent was truncated
    # mid-flow ("Now extend the tests:") with file edits done but
    # never reached `git commit`. Doubling small + bumping medium
    # gives the same 2-task batch 20 turns, well under #133's
    # max_turns cap of 100.
    small:  { max_turns: 10, timeout_sec: 300 }
    medium: { max_turns: 25, timeout_sec: 600 }
    large:  { max_turns: 40, timeout_sec: 900 }
  # Specialist agent — invoked when dispatcher routes to none of {coder,designer,documenter}.

# ═══════════════════════════════════════════
#  PHASE 3: MERGE & VERIFY
# ═══════════════════════════════════════════

retry_prepare:
  phase: merge                          # Bridge node in Phase 3 (#89)
  runs_after: []                        # graph topology (#153); receives conditional edge from tester

tester:
  backend: claude_cli                   # Was ollama — needs Bash tool to actually run pytest
  model: ""
  max_turns: 20
  timeout_sec: 300
  github_token_role: read
  phase: merge
  runs_after: []                        # graph topology (#153); receives conditional edge from code_reviewer
  human_gate: true                      # Gate 2: operator approves execution before merge
  allowed_tools:
    - Read
    - "Bash(uv run pytest *)"
    - "Bash(pytest *)"
  routes_to:                            # conditional routing (#89)
    happy_path: pr_creator
    exhausted: pr_creator
    retry: retry_prepare
  system_prompt: |
    You are the Tester agent. RUN the defined tests in the workspace and verify:
    - RED tests failed before implementation (check git history if needed)
    - GREEN tests pass after implementation
    - No regressions in the existing suite

    You have Bash and Read tools. Run `pytest` (or the project's test command).
    Report pass/fail counts and any failing test names. Do NOT modify code,
    do NOT fix tests — just report.

pr_creator:
  backend: claude_cli                   # claude_cli (active primary)
  model: ""                             # opencode 1.3.13 hangs on permissions. Reads diff via tools.
  max_turns: 15
  timeout_sec: 300
  github_token_role: code               # Dixter999 token
  phase: merge
  runs_after: []                        # graph topology (#153); receives conditional edge from tester
  allowed_tools:
    - Read
    - "Bash(gh pr *)"
    - "Bash(git push *)"
  system_prompt: |
    You are the PR Creator. Read the commits + diff on the agent branch, then create a PR.

    Use `git log` and `git diff` to see what was actually changed. The PR body must:
    - Have a clear title referencing the issue (e.g. "feat: <summary> (#<num>)")
    - Summarize the changes in 2-4 bullets
    - Reference the test results from the Tester agent
    - Link the original issue ("Closes #<num>")

    Push the agent branch first if not already pushed (`git push -u origin <branch>`),
    then create the PR with `gh pr create`.

reviewer:
  backend: claude_cli
  model: ""
  max_turns: 30
  timeout_sec: 300
  github_token_role: read
  phase: merge
  runs_after: [pr_creator]              # graph topology (#153)
  allowed_tools:
    - Read
    - Glob
    - Grep
    - "Bash(git diff *)"
    - "Bash(git log *)"
    - "Bash(git show *)"
  system_prompt: |
    You are the Reviewer agent. Review the PR for:
    - Code quality and correctness
    - Security issues
    - Test coverage
    - Architecture alignment
    Approve, request changes, or reject with specific feedback.

pr_merger:
  backend: claude_cli                   # Was ollama — deployment gate, needs synthesis (#77)
  model: ""
  max_turns: 15
  timeout_sec: 300
  github_token_role: merge              # rlagowski token — DIFFERENT USER
  phase: merge
  runs_after: [reviewer]                # graph topology (#153)
  human_gate: true                      # Gate 3: operator approves review before merge
  runs_to_end: true                     # terminal node
  allowed_tools:
    - "Bash(gh pr merge *)"
  system_prompt: |
    You are the PR Merger — the deployment gate. You can ONLY merge if:
    - Reviewer approved
    - All tests pass (Tester reported PASS)
    - No unresolved review comments
    - The diff matches the original Description's acceptance criteria

    If all checks pass: merge with squash, close the linked issue, update issue
    with the merge SHA.

    If a check fails, do NOT merge. Output a clear reason. (Future: control-flow
    plumbing will let you trigger Phase 1 / Phase 2 retries.)

# ── Split plugin agents ──────────────────────────────────────────────────────
# Used by `cortex split` only — do NOT attach to the main pipeline graph.

epic_splitter:
  backend: claude_cli
  model: ""
  max_turns: 15
  timeout_sec: 300
  github_token_role: read
  phase: split
  allowed_tools: []

epic_decomposer:
  backend: claude_cli
  model: ""
  max_turns: 20
  timeout_sec: 300
  github_token_role: read
  phase: split
  allowed_tools: []

epic_syncer:
  backend: claude_cli
  model: ""
  max_turns: 10
  timeout_sec: 180
  github_token_role: issues
  phase: split
  allowed_tools: []
