[project]
# Shared SQLAlchemy plumbing for DAP (#778 Phase 1). Import path is
# ``dap_database``. Holds the dialect-agnostic pieces previously
# duplicated between ``dap_engine.persistence.db`` and
# ``dap_engine.auth.db``: URL/dialect helpers, raw engine factories
# (SQLite WAL pragmas, PostgreSQL pool tuning), and sync/async session
# factories. Schema creation and migrations stay in the engine — this
# package never imports ORM models.
name = "dap-database"
version = "0.3.0"
description = "Shared SQLAlchemy engine + session factories for DAP (SQLite WAL / PostgreSQL)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Rafał Łagowski" },
    { name = "Daniel Łagowski" },
]
dependencies = [
    # DB drivers (aiosqlite, psycopg) are deliberately NOT declared here —
    # the consumer picks its backend and ships the driver, mirroring how
    # the engine already treats psycopg as its own dependency.
    "sqlalchemy>=2.0.52",
]
keywords = ["sqlalchemy", "database", "sqlite", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/lagowski/dap"
Repository = "https://github.com/lagowski/dap"
Issues = "https://github.com/lagowski/dap/issues"
"Author — Rafał Łagowski" = "https://www.linkedin.com/in/rafallagowski/"
"Author — Daniel Łagowski" = "https://www.linkedin.com/in/daniellagowski/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dap_database"]
