[project]
name = "dap-prompt-dsl"
version = "0.3.0"
description = "Prompt Builder — Jinja2 → XML compiler for DAP agent prompts"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Rafał Łagowski" },
    { name = "Daniel Łagowski" },
]
dependencies = [
    "jinja2>=3.1.4",
    "defusedxml>=0.7.1",
    "pydantic>=2.9.2",
]

[project.urls]
Homepage = "https://github.com/lagowski/dap"
Repository = "https://github.com/lagowski/dap"
Issues = "https://github.com/lagowski/dap/issues"
"Author — Rafał Łagowski" = "https://www.linkedin.com/in/rafallagowski/"
"Author — Daniel Łagowski" = "https://www.linkedin.com/in/daniellagowski/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dap_prompt_dsl"]
