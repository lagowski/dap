[project]
name = "dap-runtimes"
version = "0.3.0"
description = "Runtime adapters for DAP (claude-code, gemini-cli, codex, aider, api-call, bash, http)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dap-schemas",
    "anyio>=4.6.0",
]
keywords = ["agent", "llm", "pipeline", "runtime", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.55.0",
]
google = [
    "google-genai>=0.3.0",
]
api-call = [
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "google-genai>=0.3.0",
]
http = [
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "jsonpath-ng>=1.6.1",
]
all = [
    "anthropic>=0.40.0",
    "openai>=1.55.0",
    "google-genai>=0.3.0",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "jsonpath-ng>=1.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dap_runtimes"]
