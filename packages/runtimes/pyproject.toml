[project]
name = "dap-runtimes"
version = "0.3.0"
description = "Runtime adapters for DAP (claude-code, gemini-cli, codex, aider, api-call, bash, http)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Rafał Łagowski" },
    { name = "Daniel Łagowski" },
]
dependencies = [
    "dap-schemas>=0.3,<0.4",
    "anyio>=4.14.2",
]
keywords = ["agent", "llm", "pipeline", "runtime", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/lagowski/dap"
Repository = "https://github.com/lagowski/dap"
Issues = "https://github.com/lagowski/dap/issues"
"Author — Rafał Łagowski" = "https://www.linkedin.com/in/rafallagowski/"
"Author — Daniel Łagowski" = "https://www.linkedin.com/in/daniellagowski/"

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.122.0",
]
openai = [
    "openai>=3.0.0",
]
google = [
    # Lower bound bumped to >=2.7.0 in 2026-06 to match the ``uv.lock``
    # metadata that PR #632 already wrote (dependabot bumped the lockfile
    # without updating this source constraint; see follow-up tracking
    # issue). Keeps source + lockfile in sync so ``uv lock`` from a fresh
    # checkout doesn't silently downgrade google-genai.
    "google-genai>=2.10.0",
]
api-call = [
    "anthropic>=0.122.0",
    "openai>=3.0.0",
    "google-genai>=2.10.0",
]
http = [
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "jsonpath-ng>=1.6.1",
]
all = [
    "anthropic>=0.122.0",
    "openai>=3.0.0",
    "google-genai>=2.10.0",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "jsonpath-ng>=1.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dap_runtimes"]
