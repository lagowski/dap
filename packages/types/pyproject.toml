[project]
name = "dap-types"
version = "0.0.1"
description = "Shared Pydantic types for DAP (Agent, Pipeline, Run, State, Runtime)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dap_types"]
