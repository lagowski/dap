[project]
# PyPI distribution name. The Python import path stays ``dap_types`` —
# that's the source directory ``src/dap_types/`` configured below. The
# distribution name moved off ``dap-types`` because a squatter holds
# that name on PyPI; ``dap-schemas`` is more accurate anyway (this
# package is the Pydantic schema bag, not a generic types module).
name = "dap-schemas"
version = "0.3.0"
description = "Shared Pydantic schemas for DAP (Agent, Pipeline, Run, State, Runtime)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Rafał Łagowski" },
    { name = "Daniel Łagowski" },
]
dependencies = [
    "pydantic>=2.9.2",
]
keywords = ["agent", "pipeline", "pydantic", "schemas", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/lagowski/dap"
Repository = "https://github.com/lagowski/dap"
Issues = "https://github.com/lagowski/dap/issues"
"Author — Rafał Łagowski" = "https://www.linkedin.com/in/rafallagowski/"
"Author — Daniel Łagowski" = "https://www.linkedin.com/in/daniellagowski/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dap_types"]
