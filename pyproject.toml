[project]
name = "dap-workspace"
version = "0.0.1"
description = "Deterministic Agent Pipeline — root workspace (meta-package, not installed)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }

[tool.uv.workspace]
members = [
    "apps/cli",
    "apps/engine",
    "packages/types",
    "packages/runtimes",
    "packages/prompt-dsl",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "types-psutil>=6.1.0.20241102",
    "types-defusedxml>=0.7.0.20240218",
]

[tool.uv.sources]
"dap-types" = { workspace = true }
"dap-runtimes" = { workspace = true }
"dap-engine" = { workspace = true }
"dap-cli" = { workspace = true }
"dap-prompt-dsl" = { workspace = true }

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["apps", "packages"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                 # isort
    "B",                 # bugbear
    "UP",                # pyupgrade
    "RUF",               # ruff
    "SIM",               # simplify
    "PL",                # pylint subset
]
ignore = [
    "PLR0913",           # too many arguments
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # unused imports OK in __init__
"tests/**" = [
    "PLR2004",                  # magic values in tests OK
    "PLC0415",                  # local imports in tests are intentional (per-test isolation)
]
# Pydantic models need runtime access to types — TC* rules don't apply

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: Depends/Query/Path/Body w argument defaults
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

# --- mypy ---
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["build/", "dist/", ".venv/"]

# NB: dodaj override dla langgraph.* gdy zintegrujemy go w F5

[[tool.mypy.overrides]]
# jsonpath-ng has no py.typed marker. Used by the http runtime adapter.
module = ["jsonpath_ng.*"]
ignore_missing_imports = true

# --- pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps", "packages"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
